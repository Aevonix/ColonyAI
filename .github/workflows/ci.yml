name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hermes-adapter:
    runs-on: ubuntu-latest
    env:
      COLONY_TEST_HERMES_PATH: ${{ github.workspace }}/.qualification/hermes
      HERMES_TEST_SOURCE: ${{ github.workspace }}/.qualification/hermes
      AEVA_HERMES_TEST_SOURCE: ${{ github.workspace }}/.qualification/hermes
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          # Explicit qualification build; latest unmodified upstream is checked
          # separately by hermes-upstream.yml. See the compatibility note.
          repository: Kurcide/hermes-agent
          ref: 09fbad8e4e4e3e15d9b459110403494f377b434f
          path: .qualification/hermes
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            sidecar/pyproject.toml
            .qualification/hermes/pyproject.toml
      - name: Install adapter and pinned native runtime
        run: |
          python -m pip install -e ".[test,native-memory]"
          python -m pip install -e ./.qualification/hermes
          python -m pip install './sidecar[lancedb,video]'
      - name: Qualify built artifacts and profile isolation
        run: |
          export AEVA_HERMES_TEST_PYTHON="$(command -v python)"
          python -m pytest tests/hermes_adapter -q --junitxml=hermes-adapter-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          collected = list(ET.parse('hermes-adapter-results.xml').iter('testcase'))
          for module, name, expected in (
              ('test_native_task_channels', 'test_native_task_channels', 1),
              ('test_native_review_boundary', 'test_native_executor_read_only_review', 2),
              ('test_native_skill_catalog', 'test_native_skill_index_and_view_remain_authoritative', 1),
              ('test_native_skill_updates', 'test_native_skill_updates_reach_running_and_saved_conversations', 2),
          ):
              cases = [case for case in collected
                       if case.get('classname', '').endswith('.' + module)
                       and (case.get('name') == name or case.get('name', '').startswith(name + '['))]
              assert len(cases) == expected, f'{name}: expected {expected} cases, found {len(cases)}'
              assert not any(case.find(outcome) is not None for case in cases for outcome in ('skipped', 'failure', 'error')), \
                  f'{name} must run and pass'
          PY
          python -m pytest hostworker/tests -q
          python -m pytest benchmarks/source_recall/test_harness.py -q
      - name: Qualify native original-memory observations
        env:
          PYTHONPATH: ${{ github.workspace }}/.qualification/hermes
        run: |
          python -c "import hermes_state"
          python -m pytest sidecar/tests/test_native_tool_observations.py -q

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecar/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build sidecar image
        uses: docker/build-push-action@v7
        with:
          context: ./sidecar
          push: false

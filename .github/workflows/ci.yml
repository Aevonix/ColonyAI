name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hermes-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: NousResearch/hermes-agent
          ref: 29112bef099274229cadff79cdff7bf7b99c4b77
          path: .qualification/hermes
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install adapter and pinned native runtime
        run: |
          python -m pip install -e ".[test]"
          python -m pip install -e ./.qualification/hermes
          python -m pip install ./sidecar
      - name: Qualify built artifacts and profile isolation
        run: python -m pytest tests/hermes_adapter -q

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ colony_sidecar/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build sidecar image
        uses: docker/build-push-action@v7
        with:
          context: ./sidecar
          push: false

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hermes-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: NousResearch/hermes-agent
          ref: 2237be355906fbe6065ce1815711eee52b2d646e
          path: .qualification/hermes
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            sidecar/pyproject.toml
            .qualification/hermes/pyproject.toml
      - name: Install adapter and pinned native runtime
        run: |
          python -m pip install -e ".[test,native-memory]"
          python -m pip install -e ./.qualification/hermes
          python -m pip install './sidecar[lancedb,video]'
      - name: Qualify built artifacts and profile isolation
        run: |
          export AEVA_HERMES_TEST_PYTHON="$(command -v python)"
          python -m pytest tests/hermes_adapter -q
          python -m pytest hostworker/tests -q
          python -m pytest benchmarks/source_recall/test_harness.py -q

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecar/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build sidecar image
        uses: docker/build-push-action@v7
        with:
          context: ./sidecar
          push: false

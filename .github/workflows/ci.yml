name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hermes-adapter:
    runs-on: ubuntu-latest
    env:
      COLONY_TEST_HERMES_PATH: ${{ github.workspace }}/.qualification/hermes
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          # Explicit qualification build; latest unmodified upstream is checked
          # separately by hermes-upstream.yml. See the compatibility note.
          repository: Kurcide/hermes-agent
          ref: a78454b963030962ccefd7e37461e35d2082b587
          path: .qualification/hermes
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            sidecar/pyproject.toml
            .qualification/hermes/pyproject.toml
      - name: Install adapter and pinned native runtime
        run: |
          python -m pip install -e ".[test,native-memory]"
          python -m pip install -e ./.qualification/hermes
          python -m pip install './sidecar[lancedb,video]'
      - name: Qualify built artifacts and profile isolation
        run: |
          export AEVA_HERMES_TEST_PYTHON="$(command -v python)"
          python -m pytest tests/hermes_adapter -q --junitxml=hermes-adapter-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = [case for case in ET.parse('hermes-adapter-results.xml').iter('testcase')
                   if case.get('classname', '').endswith('.test_native_task_channels')
                   and case.get('name') == 'test_native_task_channels']
          assert len(cases) == 1, 'The actual concurrent native task fixture was not collected'
          assert not any(cases[0].find(outcome) is not None for outcome in ('skipped', 'failure', 'error')), \
              'The actual concurrent native task fixture must run and pass'
          PY
          python -m pytest hostworker/tests -q
          python -m pytest benchmarks/source_recall/test_harness.py -q

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecar/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build sidecar image
        uses: docker/build-push-action@v7
        with:
          context: ./sidecar
          push: false

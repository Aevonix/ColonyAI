name: colony
version: 1.0.4
description: |
  Native Hermes adapter for participant-scoped tools, durable turn capture,
  shared execution observations and native post-turn review. Preserves scope
  through delegated work and configured cron turns, reconciles forgotten sources
  before model requests, and integrates evaluated skill proposals with native
  apply and rollback.
author: Aevonix
entry_point: __init__.py
category: general
requires:
  - httpcore
  - httpx

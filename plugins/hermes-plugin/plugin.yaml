name: colony
version: 1.0.0
description: |
  Governed Colony sidecar adapter for Hermes: transport-attested private reads,
  immutable mediator-only HermesToolActionIntentV1 effects, one durable exact
  turn outbox, and text ResponseGuard through transform_llm_output. No voice path, shared event
  cache, cron autonomy, direct worker, or Hermes core patch is included.
author: Aevonix
entry_point: __init__.py
category: general
requires:
  - httpcore
  - httpx

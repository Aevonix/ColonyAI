[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apsimo-hostworker"
version = "0.2.1"
description = "Stateless, stdlib-only core for governed Apsimo host workers"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Deliberately empty: this distribution is stdlib-only and must never grow a
# dependency on FastAPI or apsimo (see apsimo_hostworker/contract.py).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apsimo_hostworker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

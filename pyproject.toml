[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colony-hermes"
version = "1.0.1"
description = "Native Hermes general and memory adapters for a Colony sidecar"
readme = "docs/HERMES-ADAPTER.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27,<0.29", "httpcore>=1,<2", "typer>=0.12,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["build>=1.2", "pytest>=8", "setuptools>=77", "wheel"]

[project.entry-points."hermes_agent.plugins"]
colony = "colony_hermes"

[project.entry-points."hermes_agent.memory_providers"]
colony-memory = "colony_memory"

[tool.setuptools]
packages = ["colony_hermes", "colony_hermes.colony_hostworker", "colony_memory"]
include-package-data = false

[tool.setuptools.package-dir]
colony_hermes = "plugins/hermes-plugin"
"colony_hermes.colony_hostworker" = "plugins/hermes-plugin/colony_hostworker"
colony_memory = "plugins/colony-memory"

[tool.setuptools.package-data]
colony_hermes = ["plugin.yaml"]
colony_memory = ["plugin.yaml", "SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests/hermes_adapter"]

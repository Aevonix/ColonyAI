[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apsimo-hermes"
version = "1.4.0"
description = "Native Hermes general and memory adapters for Apsimo"
readme = "docs/HERMES-ADAPTER.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27,<0.29", "httpcore>=1,<2", "typer>=0.12,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["build>=1.2", "pytest>=8", "setuptools>=77", "wheel"]
native-memory = ["nemo-relay>=0.8.3,<0.9"]

[project.entry-points."hermes_agent.plugins"]
apsimo = "apsimo_hermes"
colony = "apsimo_hermes"

[project.entry-points."hermes_agent.memory_providers"]
apsimo-memory = "apsimo_memory"
colony-memory = "apsimo_memory"

[tool.setuptools]
packages = ["apsimo_hermes", "apsimo_hermes.apsimo_hostworker", "apsimo_memory", "colony_hermes", "colony_memory"]
include-package-data = false

[tool.setuptools.package-dir]
apsimo_hermes = "plugins/hermes-plugin"
"apsimo_hermes.apsimo_hostworker" = "plugins/hermes-plugin/apsimo_hostworker"
apsimo_memory = "plugins/apsimo-memory"
colony_hermes = "compat/colony_hermes"
colony_memory = "compat/colony_memory"

[tool.setuptools.package-data]
apsimo_hermes = ["plugin.yaml", "SUPPLIED-INPUT.md"]
apsimo_memory = ["plugin.yaml", "SKILL.md"]
colony_hermes = ["plugin.yaml"]
colony_memory = ["plugin.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests/hermes_adapter"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pacomind-hermes"
version = "1.5.1"
description = "Native Hermes general and memory adapters for PacoMind"
readme = "docs/HERMES-ADAPTER.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27,<0.29", "httpcore>=1,<2", "typer>=0.12,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["build>=1.2", "pytest>=8", "setuptools>=77", "wheel"]
native-memory = ["nemo-relay>=0.8.3,<0.9"]

[project.entry-points."hermes_agent.plugins"]
pacomind = "pacomind_hermes"

[project.entry-points."hermes_agent.memory_providers"]
pacomind-memory = "pacomind_memory"

[tool.setuptools]
packages = ["pacomind_hermes", "pacomind_hermes.pacomind_hostworker", "pacomind_memory"]
include-package-data = false

[tool.setuptools.package-dir]
pacomind_hermes = "plugins/hermes-plugin"
"pacomind_hermes.pacomind_hostworker" = "plugins/hermes-plugin/pacomind_hostworker"
pacomind_memory = "plugins/pacomind-memory"

[tool.setuptools.package-data]
pacomind_hermes = ["plugin.yaml", "SUPPLIED-INPUT.md", "bundled_skills/*/SKILL.md"]
pacomind_memory = ["plugin.yaml", "SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests/hermes_adapter"]

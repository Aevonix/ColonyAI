[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colonyai"
version = "1.1.14"
description = "Colony intelligence sidecar — harness-agnostic cognition server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "litellm>=1.40",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "websockets>=12.0",
    "Pillow>=10.0",
    "cryptography>=42.0",
    "pypdf>=6.18.0,<7",
    "psutil>=7.2.2,<8; sys_platform == 'darwin'",
]

[project.optional-dependencies]
graph = ["neo4j>=5.18"]
neo4j = ["neo4j>=5.18"]
vectors = ["sentence-transformers>=3.0", "pandas>=2.0", "pyarrow>=15.0", "lancedb>=0.10"]
hermes = ["colony-hermes>=1.0.0,<2"]
mcp = ["mcp[cli]>=1.0,<2"]
lancedb = ["lancedb>=0.6", "pyarrow>=14.0", "pandas>=2.0"]
postgres = ["asyncpg>=0.29"]
extraction = ["PyMuPDF>=1.24", "beautifulsoup4>=4.12"]
video = ["av==18.1.0"]
dev = [
    "av==18.1.0",
    "psutil>=7.2.2,<8",
    "neo4j>=5.18",
    "sentence-transformers>=3.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "lancedb>=0.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "mcp[cli]>=1.0,<2",
]

[project.scripts]
colony = "colony_sidecar.cli:main"
colony-agent-bridge = "colony_sidecar.workers.agent_bridge:main"
colony-queue-worker = "colony_sidecar.workers.queue_worker:main"
colony-skills-sync = "colony_sidecar.workers.skills_sync:main"
colony-worker = "colony_sidecar.workers.colony_worker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["colony_sidecar*"]
exclude = ["*.tests", "*.tests.*", "*.test_*", "*.conftest"]

[tool.setuptools.package-data]
colony_sidecar = ["**/*.sql", "**/*.json", "**/*.yaml", "**/*.txt"]

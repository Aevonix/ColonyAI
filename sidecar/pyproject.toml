[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apsimo"
version = "1.4.4"
description = "Persistent identity, memory and autonomy for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "litellm>=1.40",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "websockets>=12.0",
    "Pillow>=10.0",
    "cryptography>=42.0",
    "pypdf>=6.18.0,<7",
    "psutil>=7.2.2,<8; sys_platform == 'darwin'",
]

[project.optional-dependencies]
graph = ["neo4j>=5.18"]
neo4j = ["neo4j>=5.18"]
vectors = ["sentence-transformers>=3.0", "pandas>=2.0", "pyarrow>=15.0", "lancedb>=0.10"]
hermes = ["apsimo-hermes>=1.4.4,<2"]
mcp = ["mcp[cli]>=1.0,<2"]
lancedb = ["lancedb>=0.6", "pyarrow>=14.0", "pandas>=2.0"]
extraction = ["PyMuPDF>=1.24", "beautifulsoup4>=4.12"]
video = ["av==18.1.0"]
dev = [
    "av==18.1.0",
    "psutil>=7.2.2,<8",
    "neo4j>=5.18",
    "sentence-transformers>=3.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "lancedb>=0.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "mcp[cli]>=1.0,<2",
]

[project.scripts]
apsimo = "apsimo.cli:main"
apsimo-agent-bridge = "apsimo.workers.agent_bridge:main"
apsimo-queue-worker = "apsimo.workers.queue_worker:main"
apsimo-skills-sync = "apsimo.workers.skills_sync:main"
apsimo-worker = "apsimo.workers.colony_worker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apsimo*"]
exclude = ["*.tests", "*.tests.*", "*.test_*", "*.conftest"]

[tool.setuptools.package-data]
apsimo = ["**/*.sql", "**/*.json", "**/*.yaml", "**/*.txt"]
